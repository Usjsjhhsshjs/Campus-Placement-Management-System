# Optional. Starts only PostgreSQL so you do not have to install it on Windows.
# Usage: docker compose up -d db
# Set POSTGRES_PASSWORD in your shell or in a root-level .env file (not committed).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: campus_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD first}
      POSTGRES_DB: campusconnect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
